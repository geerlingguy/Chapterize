<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3BE36B"/><stop offset="1" stop-color="#0FA43F"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="100" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="440" x2="0" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF4A3D"/><stop offset="1" stop-color="#DD1E18"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00350F" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824x824 rounded square centered on a 1024 canvas -->
  <g filter="url(#shadow)"><rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/></g>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#sheen)"/>

  <!-- Open book (drawn in a 1920x1302 space, scaled into the icon) -->
  <g filter="url(#glyphShadow)" transform="translate(147 266) scale(0.38)"
     stroke="#111" stroke-width="72" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cover: a uniform band around the pages -->
    <path fill="#111" stroke-width="140" d="M 150 238 C 420 112, 700 108, 960 226 L 960 1144 C 700 1028, 420 1034, 150 1156 Z"/>
    <path fill="#111" stroke-width="140" d="M 1770 238 C 1500 112 1220 108 960 226 L 960 1144 C 1220 1028 1500 1034 1770 1156 Z"/>
    <!-- Pages -->
    <path fill="#F4FFF6" d="M 150 238 C 420 112, 700 108, 960 226 L 960 1144 C 700 1028, 420 1034, 150 1156 Z"/>
    <path fill="#F4FFF6" d="M 1770 238 C 1500 112 1220 108 960 226 L 960 1144 C 1220 1028 1500 1034 1770 1156 Z"/>
    <!-- Spine -->
    <path d="M 960 226 L 960 1144"/>
    <!-- Text lines -->
    <g fill="none" stroke-width="60" transform="translate(0 -30)"><path d="M 300 370 C 470 318, 640 318, 810 370"/><path d="M 300 520 C 470 468, 640 468, 810 520"/><path d="M 300 670 C 470 618, 640 618, 810 670"/><path d="M 300 820 C 470 768, 640 768, 810 820"/><path d="M 300 970 C 470 918, 640 918, 810 970"/></g>
    <!-- Play button -->
    <path fill="url(#play)" stroke-width="64" d="M 1225 410 L 1225 800 L 1510 605 Z"/>
  </g>
</svg>
